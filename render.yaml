# Render Blueprint — deploy the API only (FastAPI).
# Streamlit stays local or on Streamlit Cloud; point it at this URL.
services:
  - type: web
    name: ai-eng-bootcamp-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
